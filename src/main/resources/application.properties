# ================= 默认配置（开发/测试用 H2 内存库）=================
spring.application.name=hazmat-ledger

# LOCK_TIMEOUT 调到 10 秒：并发测试里 30 个线程会争同一行，
# 默认 1~2 秒会让「排队等锁」被误判成失败，测试就变成随机红了。
spring.datasource.url=jdbc:h2:mem:hazmatdb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 表结构归 Flyway 管，Hibernate 只做校验：实体少一列、类型对不上，启动直接失败。
# 不要改回 create-drop——那会让 Flyway 建的索引与约束在重启后被丢弃。
spring.jpa.hibernate.ddl-auto=validate
# 默认不打印 SQL：压测时开着的实例两分钟写出 440 MB 日志，吞吐比关闭时低约 10%
# （与同机压测的波动同阶，但没必要为调试付这个代价）。要看条件更新与乐观锁的
# 执行语句时，启动参数加 JPA_SHOW_SQL=true 即可，不要改这里的默认值。
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 已有表但没有迁移历史的库不会被自动标记为 baseline：宁可启动失败，
# 也不要在一张结构未知的旧表上继续叠加迁移。
spring.flyway.baseline-on-migrate=false

# 8090 而不是默认的 8080，方便与本机其它 Spring Boot 应用同时运行
server.port=8090

# ================= 过载兜底 =================
# 思路：每一层资源都有上限，并且拿不到资源时**快速失败**，而不是无限排队。
# 排队看起来更"友好"，但它会把延迟从"个别请求变慢"放大成"所有请求都超时"，
# 而且内存里堆着的是线程和连接，最后往往不是慢，而是进程被打死。
#
# 连接池 = 数据库能承受的并发写。10 是保守值：单库部署时它同时是"防打爆数据库"的闸门。
# connection-timeout 必须短：池满时让请求在 3 秒内拿到 503，
# 而不是像默认的 30 秒那样——那时上游早就超时了，连接还在池里排队。
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1800000

# Tomcat 侧的上限。max 刻意大于连接池，让请求在连接池处排队/快速失败，
# 而不是先被 Tomcat 拒绝——后者连"服务暂不可用"这句话都返回不了。
# accept-count 是内核 backlog 满之后的等待队列，超过就直接拒绝连接。
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=50
server.tomcat.max-connections=1000
# 单次请求的连接建立到响应写完的超时（毫秒），避免慢客户端长期占用线程
server.tomcat.connection-timeout=10s

# 优雅停机：收到 SIGTERM 后不再接新请求，等手上的请求做完再退出。
# 不做这一步，滚动发布时每次都会切断正在提交的审批/出库请求。
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- 种子数据：库为空时灌一批试剂档案与批次，方便本地演示 ---
hazmat.seed.enabled=true

# ================= 认证与授权 =================
# JWT 对称密钥。开发默认值只用于本地；生产必须用环境变量覆盖，
# 且至少 32 字节（SecurityConfig 启动时校验，不足直接失败）。
hazmat.security.jwt-secret=${HAZMAT_JWT_SECRET:hazmat-ledger-dev-secret-change-me-0123456789}
# token 有效期。停用/改密/改角色会自增 app_user.token_version，
# 校验过滤器发现 token 里的 tv 不一致即拒绝；带 30 秒缓存，多实例下最迟 30 秒生效
hazmat.security.token-ttl=8h
# 演示账号：库为空时创建 admin / approver1 / approver2 / alice / bob
hazmat.security.seed-users=true
hazmat.security.seed-password=${HAZMAT_SEED_PASSWORD:ChangeMe123!}

# 登录失败锁定：同一用户名连续失败 5 次后锁 1 分钟。
# 计数在内存里，多实例各算各的、重启即清零——定位是"防脚本误刷与低级爆破"，
# 不是"抗分布式撞库"；后者需要认证网关或共享存储，不在本项目范围内。
hazmat.security.login-max-failures=5
hazmat.security.login-lock=1m

# ================= 试剂档案缓存 =================
# 只缓存 chemical 档案，**不缓存库存、流水与报表**：档案陈旧无害，余额陈旧就是错账。
# 边界与理由见 ChemicalCache 类注释；压测依据见 docs/开发记录.md。
#
# 超时必须短：Redis 不可用时每一次读都要白等一个超时才能回源查库，
# 1 秒是"用户还感觉不到"的上限。Lettuce 是懒连接，Redis 没起来应用照样启动。
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# Redis 的健康检查**必须关掉**。默认开启时 Redis 挂掉会让 /actuator/health 整体 DOWN，
# 而本服务的正确行为是降级查库继续提供服务——health 报 DOWN 会让编排层摘流量或重启，
# 把一个可以降级的依赖升级成不可用。缓存不是本服务的就绪条件。
management.health.redis.enabled=false

hazmat.cache.chemical.enabled=true
# 30 分钟：档案只增不改，这个 TTL 不是为了追变化，而是留一条自动自愈的路
hazmat.cache.chemical.ttl=30m
# 随机抖动，避免一批 key 在同一秒集体过期
hazmat.cache.chemical.jitter=5m

# ================= MSDS 向量索引 =================
# 默认关闭云端模型：开启后 MSDS 正文会发送到第三方服务，需要显式确认。
# 关闭时向量由本地哈希算（不联网、不要 key），索引照样能建起来。
# Windows 要启用云端：setx DASHSCOPE_API_KEY "sk-xxxx"，再设 hazmat.ai.enabled=true
hazmat.ai.enabled=false
hazmat.ai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
hazmat.ai.api-key=${DASHSCOPE_API_KEY:}
hazmat.ai.embedding-model=text-embedding-v4
hazmat.ai.embedding-dimensions=512
# 单次调用超时，超时记一次失败，不让后台线程挂住
hazmat.ai.timeout-ms=3000
# 百炼同类接口单次最多 10 条，配大了接口直接报错
hazmat.ai.batch-size=10
# 启动后在后台补齐缺失向量；测试里由 surefire 统一关掉，避免后台线程干扰断言
hazmat.ai.encode-on-startup=true
# 向量召回阈值。0 表示不过滤，阶段 3 用本项目题集标定后再填
hazmat.ai.min-score=0.0
# 失败上限：本轮连续 3 块失败即暂停，单块累计 3 次后不再自动重试
hazmat.ai.max-consecutive-failures=3
hazmat.ai.max-failures-per-chunk=3

# ================= MSDS 生成式回答（/api/msds/ask）=================
# 与 hazmat.ai.enabled 分开：算向量和「把 MSDS 正文发给生成模型」是两种数据出境行为。
# 默认关闭，关闭时不联网，/ask 返回抽取式原文片段 + 引用（generated=false）。
# 开启后默认与 embedding 共用 base-url/api-key；本地 Ollama 示例：
#   hazmat.ai.chat-enabled=true
#   hazmat.ai.base-url=http://localhost:11434/v1
#   hazmat.ai.chat-model=qwen2.5:3b
# 两者不同源时单独配生成端点（如本地 bge-m3 + 在线生成）：
#   hazmat.ai.chat-base-url=https://api.deepseek.com/v1
#   hazmat.ai.chat-api-key=${DEEPSEEK_API_KEY:}
#   hazmat.ai.chat-model=deepseek-chat
# 生成超时单独一档：生成比 embedding 慢，复用 3 秒会把正常回答判成失败。
hazmat.ai.chat-enabled=false
hazmat.ai.chat-base-url=
hazmat.ai.chat-api-key=
hazmat.ai.chat-model=qwen2.5-3b-instruct
hazmat.ai.chat-timeout-ms=20000
hazmat.ai.chat-max-tokens=800
hazmat.ai.chat-temperature=0.1

# 融合检索：两路各取 50 条候选，RRF 只看名次。
# 权重按向量路分两档，不共用一个比例：
#   local-hash（无 key 兜底）3:1 —— 字面 17、向量 6，等权融合只有 14，3:1 升到 18
#   语义模型 1:2 —— E4 实测 bge-m3 纯向量 20/20，沿用 3:1 反而降到 18/20，1:2 是 20/20、MRR 0.867
# 换模型必须用 msds-eval 题集重新标定，不能把一个比例直接带过去。
hazmat.msds.retrieval.depth=50
hazmat.msds.retrieval.rrf-k=10
hazmat.msds.retrieval.literal-weight=3.0
hazmat.msds.retrieval.vector-weight=1.0
hazmat.msds.retrieval.semantic-literal-weight=1.0
hazmat.msds.retrieval.semantic-vector-weight=2.0

# 向量存储实现：memory（默认，进程内暴力余弦）或 pgvector（向量下沉到 PostgreSQL）。
# 默认内存保证离线/无 Docker 环境照常启动；pgvector 不可用时应降级到字面路，而不是启动失败。
hazmat.vector.store=memory

# pgvector 连接。只有 hazmat.vector.store=pgvector 时才会创建连接池；
# 默认指向 compose 里映射到宿主的 5433。维度必须与 embedding 模型一致：
# bge-m3 是 1024 维，本地哈希 512 维——本地哈希向量写 pg 会被明确拒绝，这是有意的，
# 混入不同空间的向量比直接报错更难排查。
hazmat.vector.pg.url=${HAZMAT_PG_URL:jdbc:postgresql://localhost:5433/hazmat_vectors}
hazmat.vector.pg.username=${HAZMAT_PG_USERNAME:hazmat}
hazmat.vector.pg.password=${HAZMAT_PG_PASSWORD:hazmat-demo-password}
hazmat.vector.pg.dimension=1024
hazmat.vector.pg.pool-size=4
hazmat.vector.pg.connect-timeout-ms=3000
hazmat.vector.pg.query-timeout-seconds=3

# 检索的并发闸门：纯 CPU 的融合与打分，超过核数的并发只会增加上下文切换。
# 拿不到许可时等待 200ms 后返回"降级"结果，而不是让请求堆积——
# 检索是辅助功能，不能挤掉台账读写。
hazmat.msds.search.max-concurrent=4
hazmat.msds.search.wait-millis=200

# ================= 报表（MyBatis-Plus，只读） =================
# 只有 report 包用 MyBatis-Plus，写路径、实体与并发控制仍然在 JPA。
# SQL 放 XML 而不是注解：聚合语句较长，XML 里可读、可单独拷进数据库客户端执行。
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
# 数据库列下划线 -> Java 驼峰。MyBatis-Plus 默认就是 true，写出来是为了改配置的人
# 知道报表映射依赖它：关掉之后 chemical_count 不会自动映射到 chemicalCount，
# 表现为字段全是 null 而不是报错。
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ================= 运维与接口文档 =================
# 只暴露探活、版本与 Prometheus 指标。env / heapdump / loggers 之类默认不开：
# 它们会带出配置项、内存内容和内部日志，不适合直接挂在公网端口上。
# prometheus 不带业务数据，但能看出流量与错误率，生产仍建议由网关限制抓取来源。
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
# liveness / readiness 分组：容器编排用前者判断"要不要重启"，用后者判断"要不要接流量"。
# 两者语义不同——数据库挂了应该摘流量（readiness DOWN）而不是重启进程（liveness UP）。
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

# Swagger UI 与 OpenAPI JSON。演示环境默认开启；生产可用 SPRINGDOC_ENABLED=false 关掉，
# 或由网关只放行内网。登录接口本身是公开的，但文档会把全部路由与参数列出来。
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
