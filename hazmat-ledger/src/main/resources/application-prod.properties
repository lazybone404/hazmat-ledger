# ================= 生产配置（prod profile）=================
# 启动：java -jar hazmat-ledger-*.jar --spring.profiles.active=prod
#
# 这里的密钥类配置**故意不给默认值**：占位符解析不到时 Spring 直接启动失败。
# 生产上缺一个密钥就得起不来，不能悄悄退回开发默认值——那种故障通常要等到
# 第一次被人扫到才暴露。DB_USERNAME / DB_PASSWORD / HAZMAT_JWT_SECRET 三项必填。
#
# 配合 compose 使用时写进 .env（键名见根目录 .env.example），不要把真实值提交到仓库。

# ---------- 数据库：MySQL 是事实源 ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hazmat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 表结构只由 Flyway 建，Hibernate 只校验
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# H2 控制台在生产是纯暴露面，关掉
spring.h2.console.enabled=false

# ---------- 连接池：与默认配置同一套过载策略 ----------
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1800000

# ---------- 认证 ----------
# HS256 至少 32 字节，SecurityConfig 启动时校验；这里没有默认值，缺失即启动失败
hazmat.security.jwt-secret=${HAZMAT_JWT_SECRET}
hazmat.security.token-ttl=${HAZMAT_TOKEN_TTL:8h}
hazmat.security.token-cache-ttl=${HAZMAT_TOKEN_CACHE_TTL:30s}
# 自助注册默认关闭；打开后账号仍需管理员启用
hazmat.security.registration.enabled=${HAZMAT_REGISTRATION_ENABLED:false}
# 生产绝不自动建演示账号，也不灌种子数据。两者同时被 ProductionSafetyCheck 兜底校验
hazmat.security.seed-users=false
hazmat.seed.enabled=false

# ---------- 盘点复核 ----------
# 默认关闭，避免单管理员部署被流程卡死；需要双人复核时显式打开
hazmat.stocktake.require-review=${HAZMAT_STOCKTAKE_REQUIRE_REVIEW:false}
hazmat.stocktake.require-separate-confirmer=${HAZMAT_STOCKTAKE_SEPARATE_CONFIRMER:false}

# ---------- 缓存 ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
# Redis 只是加速层：挂了继续查库，不能因此让健康检查变 DOWN
management.health.redis.enabled=false
hazmat.cache.chemical.enabled=${HAZMAT_CACHE_ENABLED:true}

# ---------- 模型调用 ----------
# 是否把正文发给外部模型，生产必须显式打开，默认关
hazmat.ai.enabled=${HAZMAT_AI_ENABLED:false}
hazmat.ai.api-key=${DASHSCOPE_API_KEY:}
hazmat.ai.chat-enabled=${HAZMAT_CHAT_ENABLED:false}
hazmat.ai.chat-api-key=${DEEPSEEK_API_KEY:}

# ---------- 向量存储 ----------
hazmat.vector.store=${HAZMAT_VECTOR_STORE:memory}
# 只有切到 pgvector 时才读取这些；生产库地址必须由部署环境给出
hazmat.vector.pg.url=${HAZMAT_PG_URL:jdbc:postgresql://localhost:5432/hazmat_vectors}
hazmat.vector.pg.username=${HAZMAT_PG_USERNAME:hazmat}
hazmat.vector.pg.password=${HAZMAT_PG_PASSWORD:}
hazmat.vector.pg.dimension=${HAZMAT_PG_DIMENSION:1024}

# ---------- MSDS 编码任务队列（可选）----------
# 默认关闭；打开时 broker 地址与凭据必须显式提供，缺失由 ProductionSafetyCheck 拒绝启动。
# host/username/password 故意不给默认值：生产上不能悄悄连回 localhost 或 guest。
hazmat.mq.enabled=${HAZMAT_MQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=3s
# broker 是编码旁路的依赖，不是台账核心的就绪条件
management.health.rabbit.enabled=false

# ---------- 运维 ----------
server.port=8090
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# 接口文档在生产默认关闭：它会把全部路由与参数列出来
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# 生产日志不打印 SQL 与调试细节
logging.level.root=INFO
logging.level.com.lazybone.hazmat=INFO
