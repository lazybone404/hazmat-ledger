# =====================================================================
# 本地容器化部署：应用 + MySQL。
#
#   docker compose up -d --build
#   curl http://localhost:8090/actuator/health
#   docker compose down          # 保留数据卷
#   docker compose down -v       # 连数据一起删
#
# 只想用 H2 跑（不启动 MySQL）：
#   docker build -t hazmat-ledger:local .
#   docker run --rm -p 8090:8090 hazmat-ledger:local
#
# 下面的密码与 JWT 密钥都是演示值，不要直接用于任何公开环境。
# =====================================================================
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-demo-password
      MYSQL_DATABASE: hazmat
    ports:
      # 映射到 3307，避免与本机已有的 MySQL（3306）冲突
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      # 容器里用服务名 mysql，而不是 profile 文件里的 localhost。
      # 用户名与密码直接覆盖 datasource 配置，不经过 profile 里的占位符。
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hazmat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root-demo-password
      HAZMAT_JWT_SECRET: docker-demo-secret-change-me-0123456789abcdef
      HAZMAT_SEED_PASSWORD: ChangeMe123!
      # 容器日志里不需要每条 SQL
      JPA_SHOW_SQL: "false"
    ports:
      - "8090:8090"

volumes:
  mysql-data:
