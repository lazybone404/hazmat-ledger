# ================= MySQL 配置（生产 / 真实数据库）=================
# 使用时启动命令加： --spring.profiles.active=mysql
# 例如： java -jar hazmat-ledger-0.0.1-SNAPSHOT.jar --spring.profiles.active=mysql
# 或：   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hazmat}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
# 不在仓库里写默认密码；本地容器请用 .env 或环境变量提供。
# 注释必须单独成行：properties 文件里行内的 # 不是注释，会连同前面的空格
# 一起成为密码的一部分，表现为「Access denied ... (using password: YES)」。
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 表结构由 Flyway 的 db/migration 脚本创建，Hibernate 只校验实体与表是否一致。
# 旧版本用 ddl-auto=update 建过表的库没有 flyway_schema_history，
# 首次切换会因「表已存在」失败——先备份并清空该库（或手工建好迁移历史）再启动。
spring.jpa.hibernate.ddl-auto=validate
# 与 H2 配置一致：默认不打印，调试时用 JPA_SHOW_SQL=true 打开
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

# 端口与默认配置保持一致，两个项目仍可同时运行
server.port=8090
